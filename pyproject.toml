[project]
name = "schedule-impact"
version = "0.1.0"
description = "Detect schedule incidents from P6 XER files and link narrative PDFs for quality-related delay analysis"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "pyyaml>=6.0",
    "pdfplumber>=0.11",
    "python-dateutil>=2.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]
llm = [
    # Add provider SDK when Phase 5 is enabled
]
ocr = [
    "pymupdf>=1.24",
    # "pytesseract"  # optional OCR path
]
ml = [
    "scikit-learn>=1.4",
    "joblib>=1.3",
]

[project.scripts]
schedule-impact = "schedule_impact.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/schedule_impact"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
